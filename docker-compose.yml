services:
  api:
    build: .
    image: delegation-chain-api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/capabilities.db
      ROOT_PRINCIPAL: root
      ROOT_HMAC_SECRET: dev-root-secret-change-me
      SEED_DEMO_PRINCIPALS: "true"
    volumes:
      - chain-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  chain-data:
